<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Spice Garden</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .auth-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 40px;
      width: 100%;
      max-width: 420px;
    }
    .auth-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .auth-logo .logo-text {
      font-size: 24px;
      font-family: var(--font-display);
      color: var(--gold);
    }
    .auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }
    .auth-tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: all 0.2s;
      background: none;
      border-left: none;
      border-right: none;
      border-top: none;
    }
    .auth-tab.active {
      color: var(--gold);
      border-bottom-color: var(--gold);
    }
    .auth-form { display: none; }
    .auth-form.active { display: block; }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 12px 16px;
      background: var(--dark-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 14px;
      font-family: var(--font-body);
      outline: none;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: var(--gold);
    }
    .auth-btn {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: var(--font-body);
      margin-top: 8px;
    }
    .auth-btn:hover { background: var(--gold); color: var(--dark); }
    .alert {
      padding: 12px 16px;
      border-radius: var(--radius);
      margin-bottom: 20px;
      font-size: 14px;
    }
    .alert-error {
      background: rgba(231, 76, 60, 0.1);
      border: 1px solid rgba(231, 76, 60, 0.3);
      color: #e74c3c;
    }
    .alert-success {
      background: rgba(46, 204, 113, 0.1);
      border: 1px solid rgba(46, 204, 113, 0.3);
      color: #2ecc71;
    }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-box">

      <div class="auth-logo">
        <div class="logo-text">🍛 Spice Garden</div>
        <p style="color: var(--text-muted); font-size: 13px; margin-top: 4px;">Fine Dining</p>
      </div>

      <!-- Flash messages from Flask -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endwith %}

      <!-- Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchTab('login')">Login</button>
        <button class="auth-tab" onclick="switchTab('register')">Register</button>
      </div>

      <!-- LOGIN FORM -->
      <form class="auth-form active" id="login-form"
            action="/auth/login" method="POST">
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email"
                 placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password"
                 placeholder="Your password" required>
        </div>
        <button type="submit" class="auth-btn">Login →</button>
      </form>

      <!-- REGISTER FORM -->
      <form class="auth-form" id="register-form"
            action="/auth/register" method="POST">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="name"
                 placeholder="Rahul Sharma" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email"
                 placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password"
                 placeholder="Min 6 characters" required minlength="6">
        </div>
        <div class="form-group">
          <label>Role</label>
          <select name="role">
            <option value="customer">Customer</option>
            <option value="staff">Staff</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <button type="submit" class="auth-btn">Create Account →</button>
      </form>

    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
      document.getElementById(tab + '-form').classList.add('active');
      event.target.classList.add('active');
    }

    // Auto-switch to register tab if URL has ?tab=register
    if (window.location.search.includes('tab=register')) {
      switchTab('register');
      document.querySelectorAll('.auth-tab')[1].classList.add('active');
      document.querySelectorAll('.auth-tab')[0].classList.remove('active');
    }
  </script>
</body>
</html>
